[package]
name = "rwarp"
version = "0.3.0"
edition = "2021"
# rwarp itself (f32::next_up in Sample::step_off) and the default `proj`
# backend. The optional `proj4rs` backend needs whatever proj4rs needs,
# which it does not declare: 1.89 for proj4rs 0.3.0.
rust-version = "1.86"
authors = ["Michael Sumner <mdsumner@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "GDAL warp pipeline in Rust: coordinate transforms, approximate transforms, source window computation, and resampling kernels."
repository = "https://github.com/hypertidy/rwarp"
keywords = ["gdal", "warp", "geospatial", "raster", "reprojection"]
categories = ["science::geo"]
exclude = ["*.Rproj", ".Rproj.user", ".Rhistory", "rwarp-wasm"]

[features]
# Default: bind to libproj via the `proj` crate (full PROJ: proj.db, WKT,
# datum grids). Needs a native libproj and does not build for wasm.
default = ["proj"]
proj = ["dep:proj", "dep:proj-sys"]
# Pure-Rust backend via `proj4rs`: proj-string / EPSG-code parametric only,
# no C dependencies, builds for wasm32-unknown-unknown.
proj4rs = ["dep:proj4rs"]
# `Sample` for half-precision floats (`half::f16`), GDAL's Float16.
f16 = ["dep:half"]
# serde derives on chunk plans (`plan::WarpPlan`, `plan::Chunk`).
serde = ["dep:serde"]

[dependencies]
proj = { version = "0.31.0", features = ["pkg_config"], optional = true }
# The binding the `proj` crate itself uses, for a CRS query it does not
# expose (geographic or not, and in which angular unit). Same version.
proj-sys = { version = "0.27.0", optional = true }
# 0.3.0 is the first release with ortho (3liz/proj4rs#52).
proj4rs = { version = "0.3.0", default-features = false, features = ["crs-definitions"], optional = true }
vaster = { version = "0.2.0" }
# Exact coverage fractions for the exact-overlap area footprint. Pure Rust,
# no dependencies, builds for wasm.
controlledburn = "0.2.2"
half = { version = "2", optional = true }
serde = { version = "1", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[workspace]
exclude = ["rwarp-wasm"]
