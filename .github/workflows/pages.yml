# Build the documentation site and publish it to GitHub Pages:
#   /        the book (book/), with the changelog
#   /demo/   the rwarp-wasm browser demo
#   /api/    rustdoc for main
# One-time setup in the repo: Settings -> Pages -> Source: "GitHub Actions".
name: pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "rwarp-wasm/**"
      - "book/**"
      - "examples/**"
      - "CHANGELOG.md"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rwarp-wasm
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Native tests (proj4rs backend)
        run: |
          cargo test --no-default-features --features proj4rs
          cargo test --manifest-path rwarp-wasm/Cargo.toml
      - name: Build wasm
        run: wasm-pack build --target web --release rwarp-wasm
      - name: Install mdBook
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sSfL https://github.com/rust-lang/mdBook/releases/download/v0.4.52/mdbook-v0.4.52-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Build book
        run: mdbook build book --dest-dir ../site
      - name: Build API docs
        # proj4rs backend: no libproj needed on the runner.
        run: |
          cargo doc --no-deps --no-default-features --features proj4rs
          mkdir -p site/api
          cp -r target/doc/. site/api/
      - name: Assemble demo
        run: |
          mkdir -p site/demo/pkg
          cp rwarp-wasm/www/* site/demo/
          cp rwarp-wasm/pkg/rwarp_wasm.js rwarp-wasm/pkg/rwarp_wasm_bg.wasm site/demo/pkg/
          # www/ imports ../pkg/...; on the site pkg/ sits beside the demo.
          sed -i 's#"\.\./pkg/#"./pkg/#' site/demo/worker.js site/demo/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
