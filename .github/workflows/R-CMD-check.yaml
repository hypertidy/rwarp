on:
  push:
    branches: [main]
    paths: ['rwarp-r/**', '.github/workflows/R-CMD-check.yaml']
  pull_request:
    branches: [main]
    paths: ['rwarp-r/**', '.github/workflows/R-CMD-check.yaml']

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-24.04
    # proj-sys 0.27 needs a system PROJ >= 9.6.2. With Ubuntu 24.04's 9.4 it
    # builds its own static PROJ into the staticlib, which R's link line does
    # not complete (undefined sqlite3 symbols) and which would meet apt's 9.4
    # proj.db at run time. This image has R, Rust and PROJ built from source.
    container:
      image: ghcr.io/hypertidy/gdal-r-python-extras-rust:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Versions
        run: |
          R --version | head -1
          cargo --version
          echo "PROJ $(pkg-config --modversion proj)"

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rwarp-r
          extra-packages: any::rcmdcheck
          needs: check

      # As for a CRAN submission: crates vendored into the package, and an
      # empty NOT_CRAN so tools/config.R builds offline (cargo --offline).
      - name: Vendor crates
        run: rwarp-r/tools/vendor.sh

      - uses: r-lib/actions/check-r-package@v2
        env:
          NOT_CRAN: ""
        with:
          working-directory: rwarp-r
          upload-snapshots: true
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'

      - name: Show install log
        if: failure()
        run: cat rwarp-r/check/rwarp.Rcheck/00install.out || true
