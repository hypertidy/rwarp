on:
  push:
    branches: [main]
    paths: ['rwarp-r/**', '.github/workflows/R-CMD-check.yaml']
  pull_request:
    branches: [main]
    paths: ['rwarp-r/**', '.github/workflows/R-CMD-check.yaml']

name: R-CMD-check

jobs:
  R-CMD-check:
    runs-on: ubuntu-24.04

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Install PROJ and system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libproj-dev proj-bin libgdal-dev gdal-bin

      - name: Install stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: rwarp-r
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: rwarp-r
          upload-snapshots: true
          build_args: '--no-build-vignettes'
          args: '--no-manual --no-vignettes --as-cran'
