navbar:
  structure:
    left:  [intro, reference, articles]
    right: [rust-book, github]
  components:
    rust-book:
      text: "Rust docs"
      href: https://hypertidy.github.io/rwarp/

home:
  links:
    - text: "rwarp Rust crate"
      href: https://crates.io/crates/rwarp
