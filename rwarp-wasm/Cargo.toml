[package]
name = "rwarp-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Michael Sumner <mdsumner@gmail.com>"]
license = "MIT OR Apache-2.0"
description = "wasm-bindgen shim over rwarp: reproject RGBA tiles in the browser."
repository = "https://github.com/hypertidy/rwarp"
publish = false

[lib]
# cdylib for the wasm module; rlib so the core can be unit-tested natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
rwarp = { path = "..", default-features = false, features = ["proj4rs"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# controlledburn 0.2.2 (CoverageWindow) is not on crates.io yet: build from
# hypertidy/controlledburn-rs#13. Remove once 0.2.2 is published.
[patch.crates-io]
controlledburn = { git = "https://github.com/hypertidy/controlledburn-rs", branch = "window/coverage" }
