<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>rwarp-wasm: OSM reprojected in the browser</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,.95); padding: 10px 12px; border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); width: 300px;
  }
  #panel label { display: block; margin-top: 6px; }
  #panel input[type=text], #panel select { width: 100%; box-sizing: border-box; }
  #status { margin-top: 8px; color: #444; white-space: pre-wrap; font-family: monospace; font-size: 11px; }
  .tile-info { position: absolute; left: 2px; bottom: 2px; font: 9px monospace; color: #900; background: rgba(255,255,255,.7); }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>rwarp-wasm</b> - tiles warped client-side from any tile grid
  <label>Centre (lon, lat)
    <input type="text" id="centre" value="147, -42">
  </label>
  <label>Projection (proj string; {lon} {lat} substituted)
    <input type="text" id="proj" value="+proj=laea +lat_0={lat} +lon_0={lon} +datum=WGS84 +units=m +no_defs">
  </label>
  <div style="color:#666;font-size:11px">proj4rs backend: laea, stere, aea, lcc, tmerc, merc, eqc, moll, geos, somerc, sterea (no ortho or aeqd yet). geos needs +h=35785831; longlat works, units become degrees.</div>
  <label>Source
    <select id="preset">
      <option value="esri_imagery_wmts" selected>Esri World Imagery (WMTS)</option>
      <option value="osm">OpenStreetMap (XYZ)</option>
      <option value="carto_light">Carto light (XYZ)</option>
      <option value="gibs_3031_bluemarble">GIBS EPSG:3031 Blue Marble (WMTS)</option>
      <option value="gibs_3031_modis">GIBS EPSG:3031 MODIS true colour, latest (WMTS)</option>
      <option value="gibs_3413_bluemarble">GIBS EPSG:3413 Blue Marble (WMTS)</option>
      <option value="esri_antarctic">Esri Antarctic Imagery (ArcGIS, EPSG:3031)</option>
      <option value="esri_arctic">Esri Arctic Imagery (ArcGIS)</option>
      <option value="cop_dem_hobart">Copernicus DEM 30 m, Hobart tile (COG, float32)</option>
      <option value="custom">custom...</option>
    </select>
  </label>
  <div id="custom" hidden>
    <label>URL: WMTS GetCapabilities, ArcGIS MapServer, or XYZ template (type is detected)
      <input type="text" id="srcurl" value="https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/WMTS/1.0.0/WMTSCapabilities.xml">
    </label>
    <label>WMTS layer id (blank: only layer) / XYZ max zoom
      <input type="text" id="srcarg" value="">
    </label>
    <div style="color:#666;font-size:11px">A .tif URL is read as a COG (range requests; server must allow CORS).</div>
  </div>
  <div id="cogstyle">
    <label>COG style: colormap
      <select id="cmap"><option>viridis</option><option>magma</option><option>plasma</option><option>inferno</option><option>gray</option><option>rdbu</option><option>terrain</option></select>
    </label>
    <label>min, max (blank: auto 2-98%) <input type="text" id="range" value="" style="width:9em"></label>
    <label>bands (0-based; one, or three for RGB) <input type="text" id="bands" value="" style="width:6em"></label>
    <label>source CRS override <input type="text" id="srccrs" value="" placeholder="EPSG:3031" style="width:9em"></label>
  </div>
  <label>Resampling
    <select id="alg">
      <option>nearest</option><option selected>bilinear</option><option>cubic</option><option>lanczos</option>
    </select>
  </label>
  <label><input type="checkbox" id="debug"> show per-tile stats</label>
  <button id="apply">Apply</button>
  <div id="status"></div>
</div>

<script type="module">
import init, { lonlat_to_crs, crs_to_lonlat } from "../pkg/rwarp_wasm.js";
import { PRESETS, resolveSource, specFromUrl } from "./sources.js";
await init();

// --- Custom Leaflet CRS: "latlng" is (northing, easting) in target-CRS units.
// The tile scheme is fully described by (CRS, anchor, T0): zoom 0 is one
// 256 px tile of T0 units on a side whose top-left corner is the anchor
// point; tile (i, j, z) is T0/2^z on a side with top-left at
// (ax + i*T, ay - j*T). The anchor is the projected centre point, so the
// grid is pinned to the place of interest rather than to the CRS origin,
// and the same scheme works for a templated local projection or a fixed
// EPSG code. T0 is 2^24 (~16,777 km) for projected metres, 360 for degrees.
let T0 = Math.pow(2, 24);
let isLatLong = false;
let anchor = [0, 0];
const MetreCRS = L.extend({}, L.CRS.Simple, {
  transformation: new L.Transformation(1, 0, -1, 0),
  scale: z => (256 * Math.pow(2, z)) / T0,
  zoom: s => Math.log2((s * T0) / 256),
  infinite: true,
  distance: (a, b) => Math.hypot(a.lng - b.lng, a.lat - b.lat),
});

let dstCrs;
let source = null; // resolved grid object from sources.js
const worker = new Worker("./worker.js", { type: "module" });
const pending = new Map();
let nextId = 1;
worker.onmessage = (e) => {
  const cb = pending.get(e.data.id);
  if (cb) { pending.delete(e.data.id); cb(e.data); }
};

// Pick the source level whose ground resolution best matches this tile's
// pixel size, evaluated at the tile centre. Mercator resolution is in
// "equator metres" and scales by cos(lat) on the ground; polar stereographic
// and other local grids are near 1:1 with the ground (within a few percent).
const MERC_MAX_LAT = 85.05112878;
function pickLevel(dstPx, lat) {
  const phi = Math.min(MERC_MAX_LAT, Math.abs(lat)) * Math.PI / 180;
  const dstGround = isLatLong ? dstPx * 111319.49 * Math.cos(phi) : dstPx;
  const k = source.ground === "mercator" ? Math.cos(phi)
          : source.ground === "geographic" ? 111319.49 * Math.cos(phi) : 1;
  let best = 0, bestErr = Infinity;
  source.levels.forEach((lv, i) => {
    const err = Math.abs(Math.log2((lv.res * k) / dstGround));
    if (err < bestErr) { bestErr = err; best = i; }
  });
  return best;
}

const WarpedLayer = L.GridLayer.extend({
  createTile(coords, done) {
    const tile = document.createElement("canvas");
    tile.width = tile.height = 256;
    const T = T0 / Math.pow(2, coords.z);
    const px = T / 256;
    const dstGt = [anchor[0] + coords.x * T, px, 0, anchor[1] - coords.y * T, 0, -px];
    // Tile centre back to lon/lat: picks the source level, and tells us the
    // tile is outside the projection domain (leave it transparent).
    const ll = crs_to_lonlat(dstCrs, dstGt[0] + T / 2, dstGt[3] - T / 2);
    if (!ll) { setTimeout(() => done(null, tile), 0); return tile; }
    const id = nextId++;
    pending.set(id, ({ image, info }) => {
      if (image) tile.getContext("2d").putImageData(image, 0, 0);
      if (document.getElementById("debug").checked) {
        const ctx = tile.getContext("2d");
        ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fillRect(0, 244, 256, 12);
        ctx.fillStyle = "#900"; ctx.font = "9px monospace";
        ctx.fillText(`${coords.z}/${coords.x}/${coords.y} ${info}`, 2, 253);
      }
      done(null, tile);
    });
    worker.postMessage({
      id, source, level: pickLevel(px, ll[1]), dstCrs, dstGt,
      dstW: 256, dstH: 256, alg: document.getElementById("alg").value,
    });
    return tile;
  },
});

const map = L.map("map", { crs: MetreCRS, center: [0, 0], zoom: 6, minZoom: 2, maxZoom: 16 });
let layer, markers = L.layerGroup().addTo(map);

function sourceSpec() {
  const key = document.getElementById("preset").value;
  if (key !== "custom") {
    const p = PRESETS[key];
    return p.type === "cog" ? { ...p, crs: cogCrs() || p.crs, style: { ...p.style, ...cogStyleOverrides() } } : p;
  }
  const url = document.getElementById("srcurl").value.trim();
  const arg = document.getElementById("srcarg").value.trim();
  return specFromUrl(url, arg, { crs: cogCrs(), style: cogStyle() });
}

function cogStyle() {
  const [min, max] = document.getElementById("range").value.split(",").map(v => v.trim() === "" ? "auto" : Number(v));
  const bandsText = document.getElementById("bands").value.trim();
  return {
    colormap: document.getElementById("cmap").value,
    min: min === undefined ? "auto" : min, max: max === undefined ? "auto" : max,
    bands: bandsText ? bandsText.split(",").map(Number) : null,
  };
}
// Only the fields the user actually filled in, so a preset keeps its own
// min/max/colormap unless overridden.
function cogStyleOverrides() {
  const st = cogStyle(), o = {};
  if (document.getElementById("range").value.trim()) { o.min = st.min; o.max = st.max; }
  if (st.bands) o.bands = st.bands;
  if (document.getElementById("cmap").dataset.touched) o.colormap = st.colormap;
  return o;
}
document.getElementById("cmap").onchange = (e) => { e.target.dataset.touched = "1"; };
function cogCrs() { return document.getElementById("srccrs").value.trim() || undefined; }

async function applySettings() {
  const status = document.getElementById("status");
  status.textContent = "resolving source...";
  try {
    source = await resolveSource(sourceSpec());
  } catch (err) {
    status.textContent = "source failed: " + err;
    return;
  }
  const [lon, lat] = document.getElementById("centre").value.split(",").map(Number);
  dstCrs = document.getElementById("proj").value.replace("{lon}", lon).replace("{lat}", lat);
  isLatLong = /\+proj=(longlat|latlong)\b/.test(dstCrs) || /^EPSG:4326$/i.test(dstCrs);
  T0 = isLatLong ? 360 : Math.pow(2, 24);
  // Anchor: the projected centre point. proj4rs refuses the exact pole in
  // the forward direction, so nudge a whisker off it (sub-metre error).
  const latM = Math.abs(lat) >= 90 ? Math.sign(lat) * 89.99999 : lat;
  const p = lonlat_to_crs(dstCrs, lon, latM);
  anchor = p ? [p[0], p[1]] : [0, 0];
  // Pin the tile grid's pixel origin to the anchor: px = scale*(x - ax),
  // py = scale*(ay - y). Leaflet reads this on the reset below.
  MetreCRS.transformation = new L.Transformation(1, -anchor[0], -1, anchor[1]);
  if (layer) map.removeLayer(layer);
  map.setView([anchor[1], anchor[0]], map.getZoom(), { reset: true });
  layer = new WarpedLayer({ tileSize: 256, updateWhenZooming: false, keepBuffer: 1 }).addTo(map);
  markers.clearLayers();
  if (p) {
    L.circleMarker([p[1], p[0]], { radius: 5, color: "#d00" }).bindTooltip(`${lon}, ${lat}`).addTo(markers);
  }
  const styleLine = source.kind === "cog"
    ? `\nstyle: bands ${source.style.bands.join(",")} ${source.style.bands.length >= 3 ? "rgb" : source.style.colormap} ` +
      `[${Number(source.style.min).toPrecision(4)}, ${Number(source.style.max).toPrecision(4)}]` +
      (source.nodata !== null ? ` nodata ${source.nodata}` : "") : "";
  status.textContent = `source: ${source.name}, ${source.levels.length} levels${styleLine}\n` +
    dstCrs + (p ? "" : "\n(centre marker not placed: point rejected by the projection)");
}

map.on("mousemove", (e) => {
  const ll = crs_to_lonlat(dstCrs, e.latlng.lng, e.latlng.lat);
  document.getElementById("status").textContent =
    (source ? `source: ${source.name}\n` : "") + dstCrs + "\n" +
    `x ${e.latlng.lng.toFixed(0)}  y ${e.latlng.lat.toFixed(0)} m` +
    (ll ? `\nlon ${ll[0].toFixed(4)}  lat ${ll[1].toFixed(4)}` : "\n(outside projection domain)");
});

document.getElementById("apply").onclick = applySettings;
document.getElementById("preset").onchange = (e) => {
  document.getElementById("custom").hidden = e.target.value !== "custom";
};
applySettings();
</script>
</body>
</html>
