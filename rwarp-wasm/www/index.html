<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>rwarp-wasm: OSM reprojected in the browser</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 10px; right: 10px; z-index: 1000;
    background: rgba(255,255,255,.95); padding: 10px 12px; border-radius: 6px;
    box-shadow: 0 1px 4px rgba(0,0,0,.3); width: 300px;
  }
  #panel label { display: block; margin-top: 6px; }
  #panel input[type=text], #panel select { width: 100%; box-sizing: border-box; }
  #status { margin-top: 8px; color: #444; white-space: pre-wrap; font-family: monospace; font-size: 11px; }
  .tile-info { position: absolute; left: 2px; bottom: 2px; font: 9px monospace; color: #900; background: rgba(255,255,255,.7); }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <b>rwarp-wasm</b> - tiles warped client-side from Web Mercator
  <label>Centre (lon, lat)
    <input type="text" id="centre" value="147, -42">
  </label>
  <label>Projection (proj string; {lon} {lat} substituted)
    <input type="text" id="proj" value="+proj=laea +lat_0={lat} +lon_0={lon} +datum=WGS84 +units=m +no_defs">
  </label>
  <div style="color:#666;font-size:11px">proj4rs backend: laea, stere, aea, lcc, tmerc, merc, eqc, moll, geos, somerc, sterea (no ortho or aeqd yet)</div>
  <label>Resampling
    <select id="alg">
      <option>nearest</option><option selected>bilinear</option><option>cubic</option><option>lanczos</option>
    </select>
  </label>
  <label><input type="checkbox" id="debug"> show per-tile stats</label>
  <button id="apply">Apply</button>
  <div id="status"></div>
</div>

<script type="module">
import init, { lonlat_to_crs, crs_to_lonlat } from "../pkg/rwarp_wasm.js";
await init();

// --- Custom Leaflet CRS: "latlng" is (northing, easting) in target-CRS metres.
// Zoom 0 is one 256 px tile covering T0 metres square, centred on the origin
// of the target projection. Tile (i, j, z) is exactly T0/2^z metres on a side
// with its top-left at (i*T, -j*T), so every tile's geotransform is trivial.
const T0 = Math.pow(2, 24); // ~16,777 km: covers a hemisphere at z0
const MetreCRS = L.extend({}, L.CRS.Simple, {
  transformation: new L.Transformation(1, 0, -1, 0),
  scale: z => (256 * Math.pow(2, z)) / T0,
  zoom: s => Math.log2((s * T0) / 256),
  infinite: true,
  distance: (a, b) => Math.hypot(a.lng - b.lng, a.lat - b.lat),
});

const SRC_TEMPLATE = "https://tile.openstreetmap.org/{z}/{x}/{y}.png";
const SRC_CRS = "EPSG:3857";

let dstCrs;
const worker = new Worker("./worker.js", { type: "module" });
const pending = new Map();
let nextId = 1;
worker.onmessage = (e) => {
  const cb = pending.get(e.data.id);
  if (cb) { pending.delete(e.data.id); cb(e.data); }
};

// Pick the Web Mercator zoom whose ground resolution at latitude `lat`
// best matches the destination pixel size. Mercator metres/px at latitude
// phi is 156543.03 * cos(phi) / 2^z. Evaluated per tile at the tile's own
// centre; clamped to Mercator's latitude limit so a tile at the pole asks
// for the finest useful level rather than log2(0).
const MERC_MAX_LAT = 85.05112878;
function pickSourceZoom(dstPx, lat) {
  const phi = Math.min(MERC_MAX_LAT, Math.abs(lat)) * Math.PI / 180;
  const z = Math.log2((156543.03392804097 * Math.cos(phi)) / dstPx);
  return Math.min(19, Math.max(0, Math.round(z)));
}

const WarpedLayer = L.GridLayer.extend({
  createTile(coords, done) {
    const tile = document.createElement("canvas");
    tile.width = tile.height = 256;
    const T = T0 / Math.pow(2, coords.z);
    const px = T / 256;
    const dstGt = [coords.x * T, px, 0, -coords.y * T, 0, -px];
    // Tile centre back to lon/lat: picks the source zoom, and tells us the
    // tile is outside the projection domain (leave it transparent).
    const ll = crs_to_lonlat(dstCrs, (coords.x + 0.5) * T, -(coords.y + 0.5) * T);
    if (!ll) { setTimeout(() => done(null, tile), 0); return tile; }
    const id = nextId++;
    pending.set(id, ({ image, info }) => {
      if (image) tile.getContext("2d").putImageData(image, 0, 0);
      if (document.getElementById("debug").checked) {
        const ctx = tile.getContext("2d");
        ctx.fillStyle = "rgba(255,255,255,.7)"; ctx.fillRect(0, 244, 256, 12);
        ctx.fillStyle = "#900"; ctx.font = "9px monospace";
        ctx.fillText(`${coords.z}/${coords.x}/${coords.y} ${info}`, 2, 253);
      }
      done(null, tile);
    });
    worker.postMessage({
      id, srcTemplate: SRC_TEMPLATE, srcCrs: SRC_CRS, dstCrs, dstGt,
      dstW: 256, dstH: 256, alg: document.getElementById("alg").value,
      srcZoom: pickSourceZoom(px, ll[1]),
    });
    return tile;
  },
});

const map = L.map("map", { crs: MetreCRS, center: [0, 0], zoom: 6, minZoom: 2, maxZoom: 16 });
let layer, markers = L.layerGroup().addTo(map);

function applySettings() {
  const [lon, lat] = document.getElementById("centre").value.split(",").map(Number);
  dstCrs = document.getElementById("proj").value.replace("{lon}", lon).replace("{lat}", lat);
  if (layer) map.removeLayer(layer);
  layer = new WarpedLayer({ tileSize: 256, updateWhenZooming: false, keepBuffer: 1 }).addTo(map);
  markers.clearLayers();
  const p = lonlat_to_crs(dstCrs, lon, lat);
  if (!p) { document.getElementById("status").textContent = "cannot build transform for: " + dstCrs; return; }
  L.circleMarker([p[1], p[0]], { radius: 5, color: "#d00" }).bindTooltip(`${lon}, ${lat}`).addTo(markers);
  map.setView([0, 0], map.getZoom());
  document.getElementById("status").textContent = dstCrs;
}

map.on("mousemove", (e) => {
  const ll = crs_to_lonlat(dstCrs, e.latlng.lng, e.latlng.lat);
  document.getElementById("status").textContent =
    dstCrs + "\n" +
    `x ${e.latlng.lng.toFixed(0)}  y ${e.latlng.lat.toFixed(0)} m` +
    (ll ? `\nlon ${ll[0].toFixed(4)}  lat ${ll[1].toFixed(4)}` : "\n(outside projection domain)");
});

document.getElementById("apply").onclick = applySettings;
applySettings();
</script>
</body>
</html>
